; =============================================================================
; Pionia application settings (environment/settings.ini)
; =============================================================================
;
; Loaded at boot by EnvResolver. Most keys here are also available as .env
; variables (e.g. PORT in .env overrides [roadrunner] PORT).
;
; [server] keys are flattened into the environment at startup (the [server]
; section itself is not kept as a nested array).
;
; Database sections ([db], [analytics], …) are auto-discovered as Porm
; connections when they contain database_type / database_name or a dsn.
;
; Run `php pionia optimize` to install the optional [performance] section
; and production preload scaffolding (not enabled in the default template).
; =============================================================================

; -----------------------------------------------------------------------------
; HTTP / API envelope
; -----------------------------------------------------------------------------
; Response codes used by Moonlight JSON envelopes and framework error pages.
; Keys here become top-level env vars (NOT_FOUND_CODE, etc.).
[server]
NOT_FOUND_CODE=404
UNAUTHENTICATED_CODE=401
UNAUTHORIZED_CODE=403
SERVER_ERROR_CODE=500

; Listen host/port for `php pionia serve` (also see .env PORT / SERVER_PORT).
; RoadRunner uses [roadrunner] below; both default to the same values.
; HOST=127.0.0.1
; PORT=8000

; Unversioned API prefix (default /api/ → versioned routes at /api/v1/).
; API_BASE=/api/

; Reject non-HTTPS requests when true (also env HTTPS_ONLY).
; HTTPS_ONLY=false

; HTTP status returned by maintenance mode (also env MAINTENANCE_CODE).
; MAINTENANCE_CODE=503

; Log every SQL query to the application logger (also env LOG_QUERIES / SHOW_QUERIES).
; LOG_QUERIES=false

; Allow PDO to cast numeric strings to int/float in Porm (also env PORM_ALLOW_OBJECT_CAST).
; PORM_ALLOW_OBJECT_CAST=false

; -----------------------------------------------------------------------------
; Logging
; -----------------------------------------------------------------------------
; LOG_FORMAT: TEXT | LINE | JSON | SCALAR | HTML | SYSLOG
; HIDE_IN_LOGS: comma-separated request/context keys redacted in log output
; HIDE_SUB: replacement string for redacted values (default *********)
; LOG_HANDLERS: comma-separated Monolog handler class names (advanced)
; LOG_DESTINATION: stdout | file (advanced; default uses ErrorLogHandler)
; LOG_PROCESSORS: comma-separated Monolog processor classes (advanced)
[logging]
LOG_FORMAT=TEXT
HIDE_IN_LOGS=password,pin,token,secret
; HIDE_SUB=*********
; LOG_HANDLERS=
; LOG_DESTINATION=stdout
; LOG_PROCESSORS=

; Active log channel name (env LOG_CHANNEL; default stack).
; Set in .env: LOG_CHANNEL=stack

; -----------------------------------------------------------------------------
; Exceptions
; -----------------------------------------------------------------------------
; RENDER_TRACES: include stack traces in JSON error payloads when DEBUG=true
; DONT_REPORT: comma-separated exception class names skipped by the reporter
[exceptions]
RENDER_TRACES=true
; DONT_REPORT=

; -----------------------------------------------------------------------------
; Database (Porm)
; -----------------------------------------------------------------------------
; Default SQLite connection. Add more sections ([analytics], [reports], …) for
; additional connections; mark one with default=true.
;
; Supported keys per connection:
;   database_type  — sqlite | mysql | mariadb | pgsql | mssql | sybase | oracle
;   database_name  — database file (sqlite) or schema name
;   host           — hostname (also accepts server)
;   port           — TCP port
;   username       — database user
;   password       — database password
;   charset        — e.g. utf8mb4 (mysql)
;   socket         — unix socket path (mysql, instead of host/port)
;   prefix         — table name prefix
;   dsn            — full PDO DSN array (advanced)
;   logging        — log queries for this connection
;   allow_object_cast — per-connection object cast override
;   default=true   — mark as the default connection name
[db]
database_type=sqlite
database_name=database.sqlite3
default=true

; Example MySQL connection (uncomment and adjust):
; [mysql]
; database_type=mysql
; database_name=my_app
; host=127.0.0.1
; port=3306
; username=root
; password=
; charset=utf8mb4
; default=false

; -----------------------------------------------------------------------------
; CORS
; -----------------------------------------------------------------------------
; allowed_origins: * or comma-separated origins (e.g. Vite dev server)
; allowed_headers: * or comma-separated header names
; allowed_methods: comma-separated methods (default GET, POST, OPTIONS)
; credentials: true | false — Access-Control-Allow-Credentials
; max_age: preflight cache seconds (default 86400)
[cors]
allowed_origins=http://localhost:5173,http://127.0.0.1:5173
allowed_headers=*
credentials=true
; allowed_methods=GET,POST,OPTIONS
; max_age=86400

; -----------------------------------------------------------------------------
; Cache
; -----------------------------------------------------------------------------
; Built-in stores: filesystem (default) | array | null | database | apcu | redis
; Configure per-store overrides in [cache_<store>] sections (e.g. [cache_redis]).
[cache]
STORE=filesystem
; TTL=0

; Redis store example (requires ext-redis or predis):
; [cache_redis]
; host=127.0.0.1
; port=6379
; password=
; database=0
; prefix=pionia:
; ttl=3600

; Database store example (uses Porm cache table):
; [cache_database]
; table=cache
; connection=default
; ttl=3600

; -----------------------------------------------------------------------------
; File uploads (Moonlight services using UploadsContract)
; -----------------------------------------------------------------------------
; max_size: maximum upload bytes (default 2 MiB)
; media_dir: storage folder relative to app root (served at media_url)
; media_url: public URL path for uploaded files
; [uploads]
; max_size=2097152
; media_dir=media
; media_url=/media

; -----------------------------------------------------------------------------
; RoadRunner (php pionia runserver)
; -----------------------------------------------------------------------------
; HOST / PORT: HTTP listen address when RR is started via CLI.
; Precedence: CLI --port → .env PORT → [server] / [roadrunner] → .rr.yaml.
[roadrunner]
HOST=127.0.0.1
PORT=8000

; -----------------------------------------------------------------------------
; Background jobs (RoadRunner Jobs pool)
; -----------------------------------------------------------------------------
; Set ENABLED=true when using `php pionia runserver` with the jobs worker pool.
; PIPELINE must match a pipeline name in .rr.yaml (default moonlight).
; RPC must match .rr.yaml rpc.listen (default tcp://127.0.0.1:6001).
[jobs]
ENABLED=false
PIPELINE=moonlight
RPC=tcp://127.0.0.1:6001

; -----------------------------------------------------------------------------
; Realtime (Centrifugo / WebSockets via RoadRunner)
; -----------------------------------------------------------------------------
; Requires roadrunner-php/centrifugo and Centrifuge plugin in .rr.yaml.
[realtime]
ENABLED=false
CHANNEL_PREFIX=moonlight

; -----------------------------------------------------------------------------
; Frontend (php pionia frontend:*)
; -----------------------------------------------------------------------------
; SPA_FALLBACK: serve public/index.html for non-API GET routes (after build)
; ROOT: frontend project directory (default frontend)
; OUTPUT_DIR: build output inside ROOT (default dist)
; DEPLOY_TO: copy target after build (default public)
; PACKAGE_MANAGER: npm | pnpm | yarn | bun
; BUILD_COMMAND: production build shell command
; DEV_COMMAND: dev server command (auto-derived from PACKAGE_MANAGER if empty)
; DEV_PORT: Vite dev server port (default 5173)
[frontend]
SPA_FALLBACK=false
; ROOT=frontend
; OUTPUT_DIR=dist
; DEPLOY_TO=public
; PACKAGE_MANAGER=npm
; BUILD_COMMAND=npm run build
; DEV_COMMAND=npm run dev
; DEV_PORT=5173

; -----------------------------------------------------------------------------
; API documentation (/docs, /docs/openapi.json)
; -----------------------------------------------------------------------------
; ENABLED: expose docs routes (defaults to DEBUG when unset)
; TOKEN: optional shared secret — require ?token= or X-Docs-Token header
; [docs]
; ENABLED=true
; TOKEN=

; -----------------------------------------------------------------------------
; Developer stats (/stats, /stats.json)
; -----------------------------------------------------------------------------
; ENABLED: expose the stats dashboard (defaults to DEBUG when unset)
; TOKEN: optional shared secret — require ?token= or X-Stats-Token header
; [stats]
; ENABLED=true
; TOKEN=

; -----------------------------------------------------------------------------
; Request metrics (storage/metrics/requests.jsonl)
; -----------------------------------------------------------------------------
; ENABLED: record per-request timing (also on when DEBUG or stats enabled)
; [metrics]
; ENABLED=false

; -----------------------------------------------------------------------------
; Maintenance mode (php pionia maintenance:on|off)
; -----------------------------------------------------------------------------
; ENABLED: return 503 for all HTTP routes except /__pionia/*
; MESSAGE: body shown on the maintenance page / JSON response
; RETRY_AFTER: Retry-After header value in seconds (optional)
; BYPASS_TOKEN: accept X-Maintenance-Bypass header or ?bypass= query param
; [maintenance]
; ENABLED=false
; MESSAGE=The application is undergoing scheduled maintenance. Please try again shortly.
; RETRY_AFTER=3600
; BYPASS_TOKEN=

; -----------------------------------------------------------------------------
; Welcome page (GET /)
; -----------------------------------------------------------------------------
; Hide sections on the framework welcome screen when true.
; [welcome]
; HIDE_PORT=false
; HIDE_QUICK_START=false
; HIDE_ENV=false

; -----------------------------------------------------------------------------
; Moonlight API switches (version → ApiSwitch class)
; -----------------------------------------------------------------------------
; Register one entry per API version. Keys become route prefixes (/api/v1/, …).
[app_switches]
v1=Application\Switches\MainSwitch

; -----------------------------------------------------------------------------
; Service providers (boot-time container registration)
; -----------------------------------------------------------------------------
; Map a label to a provider class (extends Pionia\Providers\ServiceProvider).
; [app_providers]
; app=Application\Providers\AppProvider

; -----------------------------------------------------------------------------
; Production performance (installed by `php pionia optimize`)
; -----------------------------------------------------------------------------
; PRELOAD_STRATEGY: curated | stats | hybrid
; hybrid uses storage/metrics/opcache-snapshot.json when present.
; [performance]
; PRELOAD_ENABLED=true
; PRELOAD_STRATEGY=hybrid
; PRELOAD_AUTHORITATIVE=true
; BOOTSTRAP_CACHE=true
; RECORD_OPCACHE_SNAPSHOT=true
; PRELOAD_PATHS=
; PRELOAD_EXCLUDE=
